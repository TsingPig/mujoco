# ----------------------------------------------------------------------------
# Extra targets (sources/seeds we want fetched even if upstream organisation
# does not naturally feed them through the existing fetch_seeds.py rules).
# build_seeds2.py reads `extra_fetch.sources` to optionally re-invoke
# fetch_seeds.py with `--only <names>` for completeness.
# ----------------------------------------------------------------------------
extra_fetch:
  sources:
    - menagerie       # ensure skydio_x2 + bitcraze classified as actor (regex now matches)
    - mujoco_playground
    - mjx
    - myosuite
