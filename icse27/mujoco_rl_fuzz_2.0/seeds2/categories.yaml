# seeds2 / categories.yaml
#
# Declarative classification of curated MJCF seeds into the 12 MuJoCo-ecosystem
# bug categories defined in `_docs/mujoco_bug_taxonomy_seed_operator_oracle.md`.
#
# A seed (a directory under `seeds/curated/` or `seeds/_assets/`) belongs to a
# category iff (after lower-casing its directory name):
#   * the name matches ANY pattern in `name_match`, OR
#   * the seed's source token is in `sources`,           AND
#   * the name does NOT match any pattern in `name_exclude`.
#
# `explicit` always wins (forces inclusion). `name_match` / `name_exclude` are
# Python re.IGNORECASE patterns applied to the directory name (e.g. the string
# `menagerie__unitree_g1_g1`).
#
# `attach_assets` lists asset-pool families this category can pull as
# manipulation targets / scene fixtures for L3 composition operators.
#
# Document references: every category links to the doc section it implements.
# fields:
#   id           : Cn category id
#   name_zh      : 中文标题
#   description  : English one-liner reused as tooltip
#   doc_anchor   : section header in the taxonomy doc
#   operators    : suggested mutator / runtime operator subset (informational)
#   oracles      : oracle names (informational, populated by triage modules)
#   sources      : seed sources allowed in this category (informational filter)
#   name_match   : regex patterns; a seed dir name matching any becomes a member
#   name_exclude : regex patterns; if matched, seed is dropped from this cat
#   explicit     : explicit seed dir names ALWAYS included (overrides exclude)
#   attach_assets: regex over seeds/_assets/ dir names that this category can
#                  pull as manipulation targets / scene fixtures
#

categories:

  - id: C1
    name_zh: "MJCF 加载 / schema / include / asset 引用"
