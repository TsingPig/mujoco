      - version_matrix_compile
    oracles:
      - from_xml_path_success
      - schema_violation_class
      - native_vs_pymjcf_consistency
      - cross_version_compile_consistency
      - asset_reachability
    sources: [menagerie, dm_control, gym_robotics, myosuite, mujoco]
    name_match:
      - "booster_t1"
      - "ufactory_lite6"
      - "unitree_g1"
      - "robotiq_2f85_v4"
      - "myoelbow"
      - "myoarm"
